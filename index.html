<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montador de Réguas · Fluxograma de jornada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5F8;--surface:#FFFFFF;--ink:#1B2438;--muted:#5D6780;--line:#D5DAE3;
  --brand:#EE7623;--brand-soft:#FDEBDD;--accent:#0F8B8D;
  --email:#2F6FDB;--wpp:#1E9E5A;--sms:#7A4FD1;--push:#B7791F;
  --ok:#1E9E5A;--warn-bg:#FFF4E5;--warn:#9A5B00;--ph:#EEF1F6;--ph-line:#A9B3C4;--sel:#EE7623;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161F;--surface:#1B212D;--ink:#E7EBF3;--muted:#9AA4B8;--line:#2E3647;--brand:#F28A45;--brand-soft:#3A2618;--accent:#3CC3C5;
  --email:#6C9BF0;--wpp:#43C27E;--sms:#A583F0;--push:#E0A94A;--ok:#43C27E;--warn-bg:#3A2A12;--warn:#F1B45A;--ph:#222938;--ph-line:#4A5569;--sel:#F28A45}}
:root[data-theme="dark"]{
  --bg:#12161F;--surface:#1B212D;--ink:#E7EBF3;--muted:#9AA4B8;--line:#2E3647;--brand:#F28A45;--brand-soft:#3A2618;--accent:#3CC3C5;
  --email:#6C9BF0;--wpp:#43C27E;--sms:#A583F0;--push:#E0A94A;--ok:#43C27E;--warn-bg:#3A2A12;--warn:#F1B45A;--ph:#222938;--ph-line:#4A5569;--sel:#F28A45}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px}
.topbar .brand{font:700 15px Sora,Figtree,sans-serif;margin-right:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:#C9372C}
.btn:disabled{opacity:.5;cursor:default}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.topbar select{width:auto;max-width:280px}
.spacer{flex:1}
.status{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

main{padding:0 0 60px}
#sheet{background:var(--bg);padding:24px 28px 32px;width:max-content;min-width:100%}
.head h1{font:700 26px/1.2 Sora,Figtree,sans-serif;margin:0 0 4px;cursor:pointer}
.head .sub{color:var(--muted);margin:0 0 10px;max-width:900px;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);cursor:pointer}
.meta b{color:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 0;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.flow{display:flex;align-items:flex-start;margin-top:22px}
.stage{width:300px;flex:none;position:relative}
.stage.edge{width:240px}
.marker{display:flex;align-items:center;height:64px;position:relative}
.marker::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:var(--brand);z-index:0}
.stage.first .marker::after{left:50%}
.stage.last .marker::after{right:50%}
.day{position:relative;z-index:1;margin:0 auto;background:var(--brand);color:#fff;font:700 20px/1 Sora,system-ui,sans-serif;padding:12px 18px;border-radius:999px;box-shadow:0 0 0 6px var(--bg);border:0;cursor:pointer}
.edge .day{background:var(--surface);color:var(--ink);border:2px solid var(--brand);font-size:15px}
.count{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.stack{padding:16px 14px 0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:14px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card.selected{outline:2px solid var(--sel);outline-offset:2px}
.card h3{margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 14px/1.2 Figtree,sans-serif;color:var(--c)}
.card h3 small{font-weight:600;font-size:11px;color:var(--muted)}
.subj{font-weight:600;margin:0 0 4px;font-size:14px}
.pre{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-style:italic}
.body{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.body.empty{color:var(--muted);font-style:italic}
.cta{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;border:1.5px solid var(--c);color:var(--c);border-radius:6px;padding:4px 10px}
.var{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:600;border-radius:4px;padding:0 5px;white-space:nowrap}
.variant+.variant{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.vtag{font:700 11.5px Figtree,sans-serif;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
.ph{margin-top:12px;border:2px dashed var(--ph-line);background:var(--ph);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12.5px;padding:10px;gap:6px}
.ph.email{aspect-ratio:3/4}.ph.whatsapp{aspect-ratio:1/1}.ph.sms{aspect-ratio:9/16;max-height:300px}.ph.push{aspect-ratio:2/1}
.ph strong{color:var(--ink);font-size:13px}
.creative{margin-top:12px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.creative img{display:block;width:100%;height:auto}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13.5px;cursor:pointer}
.box h4{margin:0 0 6px;font:600 14px Figtree,sans-serif}
.box p{margin:0 0 6px;color:var(--muted)}
.box.in{border-left:5px solid var(--brand)}.box.ok{border-left:5px solid var(--ok)}.box.no{border-left:5px solid var(--muted)}.box.ponte{border-left:5px solid var(--accent)}
.box.selected{outline:2px solid var(--sel);outline-offset:2px}
.num{font:700 22px Sora,sans-serif;color:var(--ink)}
.flag{background:var(--warn-bg);color:var(--warn);font-size:12.5px;border-radius:6px;padding:6px 9px}
.add{border:2px dashed var(--line);background:transparent;border-radius:10px;padding:10px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;width:100%}
.add:hover{border-color:var(--brand);color:var(--brand)}
.addday{width:150px;flex:none}
.addday .day{background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none;font-size:14px}
.addday .day:hover{border-color:var(--brand);color:var(--brand)}
.menu{display:flex;flex-wrap:wrap;gap:6px}
.menu button{flex:1 1 45%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-weight:600;font-size:13px;cursor:pointer;border-left:4px solid var(--c)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-weight:600;font-size:12px;cursor:pointer}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 24px rgba(0,0,0,.08);transform:translateX(105%);transition:transform .2s}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font:700 16px Sora,Figtree,sans-serif}
.drawer .content{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.drawer label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.thumb{max-width:100%;border-radius:8px;border:1px solid var(--line)}

.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .panel{background:var(--surface);border-radius:12px;max-width:min(900px,100%);max-height:100%;overflow:auto;padding:16px}
.modal img{max-width:100%;display:block;border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty-state{padding:60px 28px;color:var(--muted);max-width:520px}

/* modo export */
.exporting .edit-only{display:none!important}
.exporting .card.selected,.exporting .box.selected{outline:0}
.exporting .card:hover{box-shadow:none}
button:focus-visible,.card:focus-visible,.box:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:640px){.topbar{padding:8px 12px}#sheet{padding:18px 14px}.stage{width:270px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Montador de Réguas</span>
  <select id="pick" aria-label="Régua"></select>
  <button class="btn edit-w" id="newR">+ Nova régua</button>
  <button class="btn edit-w" id="dupR">Duplicar</button>
  <button class="btn danger edit-w" id="delR">Excluir</button>
  <button class="btn" id="bkOut" title="Baixar todas as réguas em JSON">Backup JSON</button><button class="btn edit-w" id="bkIn" title="Importar réguas de um JSON">Importar JSON</button><input type="file" id="bkFile" accept="application/json,.json" hidden>
  <span class="spacer"></span>
  <span class="seg" role="group" aria-label="Copy">
    <button id="cFull" aria-pressed="true">Copy completa</button><button id="cShort" aria-pressed="false">Resumida</button>
  </span>
  <span class="status" id="status"></span>
  <button class="btn primary" id="exp">Exportar PNG</button>
</div>
<main id="main"><div id="sheet"></div></main>

<aside class="drawer" id="drawer" aria-label="Editor">
  <header><h2 id="dTitle">Editar</h2><button class="btn" id="dClose">Fechar</button></header>
  <div class="content" id="dBody"></div>
</aside>
<div class="modal" id="modal"><div class="panel"><div class="row" style="margin-bottom:10px;align-items:center"><strong id="mTitle">PNG gerado</strong><button class="btn" id="bkOut" title="Baixar todas as réguas em JSON">Backup JSON</button><button class="btn edit-w" id="bkIn" title="Importar réguas de um JSON">Importar JSON</button><input type="file" id="bkFile" accept="application/json,.json" hidden>
  <span class="spacer"></span><button class="btn" id="mClose">Fechar</button></div><p class="hint" id="mHint"></p><img id="mImg" alt="Prévia do PNG exportado"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
(function(){
const CH={
  "E-mail":{k:"email",c:"var(--email)",ph:"Criativo do e-mail"},
  "WhatsApp":{k:"whatsapp",c:"var(--wpp)",ph:"Criativo do WhatsApp"},
  "SMS":{k:"sms",c:"var(--sms)",ph:"Mockup do SMS"},
  "Push":{k:"push",c:"var(--push)",ph:"Imagem do push (opcional)"}
};
const VARMAP={"name":"Nome do aluno","nome":"Nome do aluno","insc curso":"Curso inscrito","curso":"Curso inscrito"};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,16);
const $=id=>document.getElementById(id);
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- estado ---------- */
let db=null,assets=null,downloads=null,col=null,canEdit=true;
let list=[];          // [{id,codigo,nome}]
let cur=null;         // régua atual
let sel=null;         // seleção
let short=false;
let saveTimer=null,saving=false,pending=false;

function blank(){
  return {id:uid(),codigo:'',nome:'Nova régua',descricao:'',funil:'',operacao:'',gatilho:'',saidaCriterio:'',
    entrada:{titulo:'Entra na régua',texto:'Descreva a regra de entrada.',numero:''},
    dias:[{id:uid(),n:1,alerta:'',itens:[]}],
    saidas:[{id:uid(),tipo:'ok',titulo:'Converteu',texto:'Atingiu o critério de saída.',numero:''},
            {id:uid(),tipo:'no',titulo:'Não converteu',texto:'Completou o fluxo sem converter.',numero:''}],
    updatedAt:''};
}
function newVariant(tag){return {id:uid(),tag:tag||'',assunto:'',pre:'',corpo:'',cta:'',img:''}}

/* ---------- persistência ---------- */
const LS='montador_reguas_v1';let LOCAL={};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('montador_reguas',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbLoad(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(LS);q.onsuccess=()=>res(q.result||{});q.onerror=()=>res({})})}catch(e){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(_){return {}}}}
async function idbSave(o){try{const d=await idb();await new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(o,LS);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){try{localStorage.setItem(LS,JSON.stringify(o))}catch(_){toast('Não foi possível salvar no navegador.')}}}
function lsGet(){return LOCAL}
function lsSet(o){LOCAL=o;idbSave(o)}
function status(m){$('status').textContent=m}

async function persist(){
  if(!cur)return;
  cur.updatedAt=new Date().toISOString();
  if(col){
    if(saving){pending=true;return}
    saving=true;status('Salvando…');
    try{await col.doc(cur.id).set(JSON.parse(JSON.stringify(cur)));status('Salvo')}
    catch(e){status(e&&e.code==='permission_denied'?'Sem permissão para salvar':'Erro ao salvar');}
    saving=false;if(pending){pending=false;persist()}
  }else{
    const all=lsGet();all[cur.id]=cur;lsSet(all);status('Salvo neste navegador');
    refreshListLocal();
  }
}
function changed(rerender=true){
  if(rerender)render();
  status('Alterações não salvas');
  clearTimeout(saveTimer);saveTimer=setTimeout(persist,700);
}
function refreshListLocal(){
  const all=lsGet();list=Object.values(all).map(r=>({id:r.id,codigo:r.codigo,nome:r.nome,updatedAt:r.updatedAt}));fillPick();
}
function fillPick(){
  const p=$('pick');p.innerHTML='';
  list.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  list.forEach(r=>{const o=el('option',null,(r.codigo?r.codigo+' · ':'')+(r.nome||'Sem nome'));o.value=r.id;p.appendChild(o)});
  if(cur)p.value=cur.id;
  $('delR').disabled=!cur;$('dupR').disabled=!cur;
}
async function openRegua(id){
  sel=null;closeDrawer();
  if(col){const s=await col.doc(id).get();cur=s.exists?s.data():null;if(cur)cur=JSON.parse(JSON.stringify(cur))}
  else{cur=lsGet()[id]||null}
  render();fillPick();
}
async function createRegua(base){
  const r=base?JSON.parse(JSON.stringify(base)):blank();
  if(base){r.id=uid();r.nome=(r.nome||'')+' (cópia)';}
  cur=r;list.push({id:r.id,codigo:r.codigo,nome:r.nome,updatedAt:new Date().toISOString()});
  await persist();fillPick();render();
  if(!base)select({type:'meta'});
}
async function deleteRegua(){
  if(!cur||!confirm('Excluir a régua "'+(cur.nome||'')+'"? Essa ação não pode ser desfeita.'))return;
  const id=cur.id;
  if(col){try{await col.doc(id).delete()}catch(e){toast('Não foi possível excluir.');return}}
  else{const all=lsGet();delete all[id];lsSet(all)}
  list=list.filter(r=>r.id!==id);cur=null;
  if(list.length)await openRegua(list[0].id);else{render();fillPick()}
}

/* ---------- texto / variáveis ---------- */
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function varLabel(inner){
  const name=inner.split('|')[0].trim();
  if(name==='1')return 'Nome do aluno';
  if(/^\d+$/.test(name))return 'Variável '+name;
  return VARMAP[name.toLowerCase()]||name;
}
function richText(s,canal){
  let t=String(s||'');
  if(short){t=t.replace(/\s+/g,' ').trim();if(t.length>180)t=t.slice(0,180).replace(/\s\S*$/,'')+'…'}
  let h=esc(t);
  h=h.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,inner)=>'<span class="var">'+esc(varLabel(inner))+'</span>');
  if(canal==='WhatsApp'){h=h.replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g,'$1<i>$2</i>')}
  return h.replace(/\n{2,}/g,'\n').replace(/\n/g,'<br>');
}

/* ---------- render ---------- */
function imgSrc(i){return /^data:/.test(i)?i:'/_blob/'+i}
function isSel(o){return sel&&Object.keys(o).every(k=>sel[k]===o[k])}
function render(){
  const sh=$('sheet');sh.innerHTML='';
  if(!cur){
    const e=el('div','empty-state');e.innerHTML='<h2 style="color:var(--ink);font:700 20px Sora,sans-serif">Nenhuma régua ainda</h2><p>Crie uma régua e vá adicionando dias, canais e criativos. No final, exporte o fluxograma em PNG.</p>';
    const b=el('button','btn primary','+ Criar primeira régua');b.onclick=()=>createRegua();e.appendChild(b);
    if(!canEdit)b.style.display='none';
    sh.appendChild(e);return;
  }
  const r=cur;
  // cabeçalho
  const head=el('div','head');
  const h1=el('h1',null,(r.codigo?'Régua '+r.codigo+' · ':'')+(r.nome||'Sem nome'));
  const sub=el('p','sub',r.descricao||'');if(!r.descricao)sub.style.display='none';
  const meta=el('div','meta');
  [['Funil',r.funil],['Operação',r.operacao],['Gatilho',r.gatilho],['Saída',r.saidaCriterio]].forEach(([k,v])=>{if(v){const s=el('span');s.append(k+' ');s.appendChild(el('b',null,v));meta.appendChild(s)}});
  [h1,sub,meta].forEach(x=>x.onclick=()=>select({type:'meta'}));
  head.append(h1,sub,meta);
  const used=new Set();r.dias.forEach(d=>d.itens.forEach(i=>used.add(i.canal)));
  const lg=el('div','legend');
  Object.keys(CH).filter(c=>used.has(c)).forEach(c=>{const s=el('span');const d=el('i','dot');d.style.background=CH[c].c;s.append(d,c);lg.appendChild(s)});
  const hasVar=JSON.stringify(r.dias).includes('{{');
  if(hasVar){const s=el('span');s.appendChild(el('i','var','Nome do aluno'));s.append(' variável');lg.appendChild(s)}
  head.appendChild(lg);
  sh.appendChild(head);

  const flow=el('div','flow');sh.appendChild(flow);
  // entrada
  let st=stage(flow,'Entrada',{edge:1,first:1,onclick:()=>select({type:'entrada'})});
  st.appendChild(box('in',r.entrada,{type:'entrada'}));
  // dias
  const dias=[...r.dias].sort((a,b)=>a.n-b.n);
  dias.forEach(d=>{
    const n=d.itens.length;
    const s=stage(flow,'D+'+d.n,{count:n?n+(n>1?' comunicações':' comunicação'):'',onclick:()=>select({type:'dia',dia:d.id})});
    d.itens.forEach(it=>s.appendChild(card(d,it)));
    if(d.alerta)s.appendChild(el('div','flag','⚠ '+d.alerta));
    if(canEdit){
      const wrap=el('div','edit-only');
      const add=el('button','add','+ Canal');
      const menu=el('div','menu');menu.style.display='none';
      Object.keys(CH).forEach(c=>{const b=el('button',null,c);b.style.setProperty('--c',CH[c].c);b.onclick=()=>addItem(d,c);menu.appendChild(b)});
      add.onclick=()=>{menu.style.display=menu.style.display==='none'?'flex':'none';add.style.display=menu.style.display==='none'?'':'none'};
      wrap.append(add,menu);s.appendChild(wrap);
    }
  });
  // + dia
  if(canEdit){
    const a=el('div','stage addday edit-only');const m=el('div','marker');const b=el('button','day','+ Dia');b.onclick=addDay;m.appendChild(b);a.appendChild(m);flow.appendChild(a);
  }
  // saída
  st=stage(flow,'Saída',{edge:1,last:1});
  r.saidas.forEach(o=>st.appendChild(box(o.tipo,o,{type:'saida',id:o.id})));
  if(canEdit){const b=el('button','add edit-only','+ Bloco de saída');b.onclick=()=>{const o={id:uid(),tipo:'ponte',titulo:'Segue para a régua…',texto:'',numero:''};r.saidas.push(o);changed();select({type:'saida',id:o.id})};st.appendChild(b)}
}
function stage(flow,label,o){
  const s=el('div','stage'+(o.edge?' edge':'')+(o.first?' first':'')+(o.last?' last':''));
  const m=el('div','marker');const b=el('button','day',label);
  if(o.onclick&&canEdit)b.onclick=o.onclick;else b.style.cursor='default';
  m.appendChild(b);s.appendChild(m);
  if(o.count)s.appendChild(el('div','count',o.count));
  const st=el('div','stack');s.appendChild(st);flow.appendChild(s);return st;
}
function box(tipo,o,selObj){
  const b=el('div','box '+tipo+(isSel(selObj)?' selected':''));
  b.appendChild(el('h4',null,o.titulo||''));
  if(o.texto)b.appendChild(el('p',null,o.texto));
  if(o.numero){b.appendChild(el('div','num',o.numero));if(o.numeroLabel)b.appendChild(el('p',null,o.numeroLabel))}
  if(canEdit){b.tabIndex=0;b.onclick=()=>select(selObj)}
  return b;
}
function card(d,it){
  const c=el('article','card'+(isSel({type:'item',dia:d.id,item:it.id})?' selected':''));
  c.style.setProperty('--c',CH[it.canal].c);
  const h=el('h3');h.append(it.canal);if(it.vars.length>1)h.appendChild(el('small',null,'A/B'));c.appendChild(h);
  it.vars.forEach((v,i)=>{
    const w=el('div','variant');
    if(it.vars.length>1||v.tag)w.appendChild(el('p','vtag',v.tag||('Variante '+(i+1))));
    if(v.assunto)w.appendChild(el('p','subj',v.assunto));
    if(v.pre)w.appendChild(el('p','pre','Pré-header: '+v.pre));
    const b=el('p','body'+(v.corpo?'':' empty'));
    if(v.corpo)b.innerHTML=richText(v.corpo,it.canal);else b.textContent='Clique para escrever a copy.';
    w.appendChild(b);
    if(v.cta)w.appendChild(el('span','cta',v.cta));
    if(v.img){const f=el('div','creative');const img=el('img');img.src=imgSrc(v.img);img.alt='Criativo '+it.canal;img.crossOrigin='anonymous';f.appendChild(img);w.appendChild(f)}
    else{
      const p=el('div','ph '+CH[it.canal].k);p.appendChild(el('strong',null,CH[it.canal].ph));p.appendChild(el('span',null,'Espaço reservado · D+'+d.n+'_'+CH[it.canal].k+(it.vars.length>1?'_'+(v.tag||i+1):'')));
      if(canEdit){const u=el('button','mini edit-only','Enviar imagem');u.onclick=e=>{e.stopPropagation();upload(v)};p.appendChild(u)}
      w.appendChild(p);
    }
    c.appendChild(w);
  });
  if(canEdit){c.tabIndex=0;c.onclick=()=>select({type:'item',dia:d.id,item:it.id});c.onkeydown=e=>{if(e.key==='Enter')c.click()}}
  return c;
}

/* ---------- ações ---------- */
function addDay(){
  const last=cur.dias.reduce((m,d)=>Math.max(m,d.n),-1);
  const d={id:uid(),n:last+1,alerta:'',itens:[]};cur.dias.push(d);changed();select({type:'dia',dia:d.id});
}
function addItem(d,canal){
  const it={id:uid(),canal,vars:[newVariant('')]};d.itens.push(it);changed();select({type:'item',dia:d.id,item:it.id});
}
function findDia(id){return cur.dias.find(d=>d.id===id)}
let upTarget=null;
function toDataURL(f){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(f);img.onload=()=>{const max=1200,s=Math.min(1,max/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85))};img.onerror=rej;img.src=u})}
function upload(v){upTarget=v;$('file').value='';$('file').click()}
$('file').onchange=async()=>{
  const f=$('file').files[0];if(!f||!upTarget)return;
  status('Enviando imagem…');
  try{if(assets){const r=await assets.upload(f);upTarget.img=r.id}else{upTarget.img=await toDataURL(f)}changed();if(sel)select(sel);toast('Criativo incluído.')}
  catch(e){status('');toast('Não foi possível enviar ('+(e&&e.code||'erro')+').')}
  upTarget=null;
};

/* ---------- editor lateral ---------- */
function closeDrawer(){$('drawer').classList.remove('open');sel=null;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'))}
$('dClose').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('modal').classList.remove('open')}});
function field(label,val,onInput,o={}){
  const l=el('label',null,label);
  const i=o.area?el('textarea'):el('input');if(!o.area)i.type=o.type||'text';
  i.value=val||'';if(o.ph)i.placeholder=o.ph;
  i.oninput=()=>{onInput(i.value);changed()};
  l.appendChild(i);if(o.hint)l.appendChild(el('span','hint',o.hint));return l;
}
function select(s){
  if(!canEdit)return;
  sel=s;render();
  const body=$('dBody');body.innerHTML='';$('drawer').classList.add('open');
  if(s.type==='meta'){
    $('dTitle').textContent='Dados da régua';
    body.append(
      field('Código / ID',cur.codigo,v=>cur.codigo=v,{ph:'Ex.: 3878'}),
      field('Nome',cur.nome,v=>cur.nome=v),
      field('Descrição',cur.descricao,v=>cur.descricao=v,{ph:'Opcional: uma linha sobre o público e o objetivo'}),
      field('Funil / etapa',cur.funil,v=>cur.funil=v,{ph:'Ex.: TEC · Inscrito'}),
      field('Operação',cur.operacao,v=>cur.operacao=v,{ph:'Ex.: Interno'}),
      field('Gatilho',cur.gatilho,v=>cur.gatilho=v,{ph:'Ex.: Aprovado2'}),
      field('Critério de saída',cur.saidaCriterio,v=>cur.saidaCriterio=v,{ph:'Ex.: Matriculado + PAGO/ISENTO'})
    );
  }
  else if(s.type==='entrada'){
    $('dTitle').textContent='Entrada';const o=cur.entrada;
    body.append(field('Título',o.titulo,v=>o.titulo=v),field('Regra de entrada',o.texto,v=>o.texto=v,{area:1}),field('Número em destaque',o.numero,v=>o.numero=v,{ph:'Ex.: 4.401'}),field('Legenda do número',o.numeroLabel,v=>o.numeroLabel=v,{ph:'Ex.: entradas (90 dias)'}));
  }
  else if(s.type==='saida'){
    const o=cur.saidas.find(x=>x.id===s.id);if(!o)return closeDrawer();
    $('dTitle').textContent='Bloco de saída';
    const l=el('label',null,'Tipo');const t=el('select');[['ok','Converteu'],['no','Não converteu'],['ponte','Segue para outra régua']].forEach(([v,n])=>{const op=el('option',null,n);op.value=v;t.appendChild(op)});t.value=o.tipo;t.onchange=()=>{o.tipo=t.value;changed()};l.appendChild(t);
    const del=el('button','btn danger','Excluir bloco');del.onclick=()=>{cur.saidas=cur.saidas.filter(x=>x!==o);changed();closeDrawer()};
    body.append(l,field('Título',o.titulo,v=>o.titulo=v),field('Texto',o.texto,v=>o.texto=v,{area:1}),field('Número em destaque',o.numero,v=>o.numero=v),field('Legenda do número',o.numeroLabel,v=>o.numeroLabel=v),el('hr','sep'),del);
  }
  else if(s.type==='dia'){
    const d=findDia(s.dia);if(!d)return closeDrawer();
    $('dTitle').textContent='Dia D+'+d.n;
    const n=field('Dia (número após a entrada)',d.n,v=>{const x=parseInt(v,10);if(!isNaN(x)&&x>=0){d.n=x;$('dTitle').textContent='Dia D+'+x}},{type:'number',hint:'O fluxo se reordena sozinho.'});
    const al=field('Alerta do dia (opcional)',d.alerta,v=>d.alerta=v,{ph:'Ex.: 5 toques no mesmo dia'});
    const dup=el('button','btn','Duplicar dia');dup.onclick=()=>{const c=JSON.parse(JSON.stringify(d));c.id=uid();c.n=d.n+1;c.itens.forEach(i=>{i.id=uid();i.vars.forEach(v=>{v.id=uid();v.img=''})});cur.dias.push(c);changed();select({type:'dia',dia:c.id})};
    const del=el('button','btn danger','Excluir dia');del.onclick=()=>{if(d.itens.length&&!confirm('Excluir D+'+d.n+' e as '+d.itens.length+' comunicações?'))return;cur.dias=cur.dias.filter(x=>x!==d);changed();closeDrawer()};
    const row=el('div','row');row.append(dup,del);
    body.append(n,al,el('hr','sep'),row);
  }
  else if(s.type==='item'){
    const d=findDia(s.dia);const it=d&&d.itens.find(i=>i.id===s.item);if(!it)return closeDrawer();
    $('dTitle').textContent=it.canal+' · D+'+d.n;
    // canal + dia
    const r1=el('div','row');
    const lc=el('label',null,'Canal');const sc=el('select');Object.keys(CH).forEach(c=>{const o=el('option',null,c);o.value=c;sc.appendChild(o)});sc.value=it.canal;sc.onchange=()=>{it.canal=sc.value;changed();select(s)};lc.appendChild(sc);
    const ld=el('label',null,'Dia');const sd=el('select');[...cur.dias].sort((a,b)=>a.n-b.n).forEach(x=>{const o=el('option',null,'D+'+x.n);o.value=x.id;sd.appendChild(o)});sd.value=d.id;
    sd.onchange=()=>{const to=findDia(sd.value);d.itens=d.itens.filter(i=>i!==it);to.itens.push(it);changed();select({type:'item',dia:to.id,item:it.id})};ld.appendChild(sd);
    r1.append(lc,ld);body.appendChild(r1);
    // variantes
    const vi=s.v&&it.vars.find(v=>v.id===s.v)?it.vars.findIndex(v=>v.id===s.v):0;
    const tabs=el('div','tabs');
    it.vars.forEach((v,i)=>{const b=el('button',null,v.tag||('Variante '+(i+1)));b.setAttribute('aria-pressed',i===vi);b.onclick=()=>select({...s,v:v.id});tabs.appendChild(b)});
    const addV=el('button',null,'+ Variante A/B');addV.onclick=()=>{
      if(it.vars.length===1&&!it.vars[0].tag)it.vars[0].tag='Teste A';
      const base=it.vars[vi];const nv={...JSON.parse(JSON.stringify(base)),id:uid(),img:'',tag:'Teste '+String.fromCharCode(65+it.vars.length)};
      it.vars.push(nv);changed();select({...s,v:nv.id})};
    tabs.appendChild(addV);body.appendChild(tabs);
    const v=it.vars[vi];
    if(it.vars.length>1||v.tag)body.appendChild(field('Rótulo da variante',v.tag,x=>v.tag=x,{ph:'Ex.: Teste A · persona Ana'}));
    if(it.canal==='E-mail'||it.canal==='Push')body.appendChild(field(it.canal==='Push'?'Título':'Assunto',v.assunto,x=>v.assunto=x));
    if(it.canal==='E-mail')body.appendChild(field('Pré-header',v.pre,x=>v.pre=x));
    body.appendChild(field('Copy',v.corpo,x=>v.corpo=x,{area:1,hint:it.canal==='WhatsApp'?'Variáveis como {{1}} ou {{Name|Futuro aluno}} viram etiqueta. *negrito* e _itálico_ do WhatsApp são aplicados.':'Variáveis como {{Name|Futuro aluno}} viram etiqueta no fluxo.'+(it.canal==='SMS'?' Caracteres: '+(v.corpo||'').length:'')}));
    if(it.canal!=='SMS')body.appendChild(field('CTA / botão',v.cta,x=>v.cta=x));
    // criativo
    const lc2=el('label',null,'Criativo');
    if(v.img){const im=el('img','thumb');im.src=imgSrc(v.img);im.alt='Criativo atual';lc2.appendChild(im)}
    const r2=el('div','row');
    {const up=el('button','btn',v.img?'Trocar imagem':'Enviar imagem');up.onclick=()=>upload(v);r2.appendChild(up)}
    if(v.img){const rm=el('button','btn danger','Remover imagem');rm.onclick=()=>{v.img='';changed();select(s)};r2.appendChild(rm)}
    lc2.appendChild(r2);body.appendChild(lc2);
    body.appendChild(el('hr','sep'));
    // ordenar / excluir
    const r3=el('div','row');
    const up=el('button','btn','↑ Subir');up.onclick=()=>{const i=d.itens.indexOf(it);if(i>0){d.itens.splice(i,1);d.itens.splice(i-1,0,it);changed();select(s)}};
    const dn=el('button','btn','↓ Descer');dn.onclick=()=>{const i=d.itens.indexOf(it);if(i<d.itens.length-1){d.itens.splice(i,1);d.itens.splice(i+1,0,it);changed();select(s)}};
    const dp=el('button','btn','Duplicar');dp.onclick=()=>{const c=JSON.parse(JSON.stringify(it));c.id=uid();c.vars.forEach(x=>{x.id=uid();x.img=''});d.itens.splice(d.itens.indexOf(it)+1,0,c);changed();select({type:'item',dia:d.id,item:c.id})};
    r3.append(up,dn,dp);body.appendChild(r3);
    const r4=el('div','row');
    if(it.vars.length>1){const dv=el('button','btn danger','Excluir variante');dv.onclick=()=>{it.vars.splice(vi,1);if(it.vars.length===1&&/^Teste [AB]$/.test(it.vars[0].tag))it.vars[0].tag='';changed();select({type:'item',dia:d.id,item:it.id})};r4.appendChild(dv)}
    const di=el('button','btn danger','Excluir comunicação');di.onclick=()=>{d.itens=d.itens.filter(i=>i!==it);changed();closeDrawer()};r4.appendChild(di);
    body.appendChild(r4);
  }
  // re-render sem perder foco: campos já chamam changed() -> render do canvas apenas
}

/* ---------- topo ---------- */
$('pick').onchange=()=>openRegua($('pick').value);
$('newR').onclick=()=>createRegua();
$('dupR').onclick=()=>cur&&createRegua(cur);
$('delR').onclick=deleteRegua;
$('cFull').onclick=()=>{short=false;$('cFull').setAttribute('aria-pressed','true');$('cShort').setAttribute('aria-pressed','false');render()};
$('cShort').onclick=()=>{short=true;$('cShort').setAttribute('aria-pressed','true');$('cFull').setAttribute('aria-pressed','false');render()};
$('mClose').onclick=()=>$('modal').classList.remove('open');

/* ---------- backup ---------- */
$('bkOut').onclick=async()=>{
  let all=[];
  if(col){const s=await col.get();all=s.docs.filter(x=>x.exists).map(x=>x.data())}else all=Object.values(lsGet());
  const blob=new Blob([JSON.stringify({versao:1,reguas:all},null,1)],{type:'application/json'});const name='reguas_backup.json';
  if(downloads){try{await downloads.save({filename:name,data:blob});return}catch(e){if(e&&e.code==='declined')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
};
$('bkIn').onclick=()=>{$('bkFile').value='';$('bkFile').click()};
$('bkFile').onchange=async()=>{
  const f=$('bkFile').files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const rs=Array.isArray(j)?j:(j.reguas||[j]);let n=0;
    for(const r of rs){if(!r||!Array.isArray(r.dias))continue;r.id=r.id||uid();cur=r;
      if(!list.find(x=>x.id===r.id))list.push({id:r.id,codigo:r.codigo,nome:r.nome,updatedAt:r.updatedAt});await persist();n++}
    fillPick();render();toast(n+' régua(s) importada(s).')}
  catch(e){toast('Arquivo inválido.')}
};

/* ---------- exportar PNG ---------- */
$('exp').onclick=async()=>{
  if(!cur){toast('Crie uma régua primeiro.');return}
  if(typeof html2canvas!=='function'){toast('Exportação indisponível: biblioteca não carregou.');return}
  const btn=$('exp');btn.disabled=true;btn.textContent='Gerando…';
  const keepSel=sel;sel=null;render();
  const sheet=$('sheet');document.body.classList.add('exporting');
  await Promise.all([...sheet.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  try{
    const W=sheet.scrollWidth,H=sheet.scrollHeight;
    const scale=Math.max(0.5,Math.min(2,16000/W,16000/H,Math.sqrt(220e6/(W*H))));
    const bg=getComputedStyle(document.body).backgroundColor;
    const canvas=await html2canvas(sheet,{scale,backgroundColor:bg,useCORS:true,width:W,height:H,windowWidth:W+80,scrollX:0,scrollY:-window.scrollY});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const name='regua_'+(cur.codigo||'sem_codigo')+'_fluxo.png';
    let saved=false;
    if(downloads){
      try{await downloads.save({filename:name,data:blob});saved=true;toast('PNG exportado.')}
      catch(e){if(e&&e.code==='declined'){toast('Download cancelado.');saved=true}else if(e&&e.code==='rate_limited'){toast('Aguarde um instante e tente de novo.');saved=true}}
    }
    if(!saved&&!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();saved=true;toast('PNG exportado.')}
    if(!saved){
      $('mImg').src=URL.createObjectURL(blob);$('mTitle').textContent=name;
      $('mHint').textContent='Clique com o botão direito na imagem e escolha "Salvar imagem como…".';
      $('modal').classList.add('open');
    }
  }catch(e){toast('Não foi possível gerar o PNG.')}
  document.body.classList.remove('exporting');sel=keepSel;render();
  btn.disabled=false;btn.textContent='Exportar PNG';
};

/* ---------- init ---------- */
render();status('');
(async()=>{
  LOCAL=await idbLoad();refreshListLocal();
  try{
    if(!window.claude||!window.claude.use){if(list.length)openRegua(list[0].id);return}
    const [d,a,dl,u]=await Promise.all([claude.use('db'),claude.use('assets'),claude.use('downloads'),claude.use('user')]);
    downloads=dl;assets=a;
    if(u&&typeof u.can==='function'){const c=u.can('data.write');if(c===false)canEdit=false}
    if(d){
      db=d;col=db.collection('reguas');list=[];fillPick();
      col.onSnapshot(snap=>{
        list=snap.docs.filter(x=>x.exists).map(x=>{const r=x.data();return {id:x.id,codigo:r.codigo,nome:r.nome,updatedAt:r.updatedAt}});
        if(cur&&!list.find(x=>x.id===cur.id)&&!saving)list.push({id:cur.id,codigo:cur.codigo,nome:cur.nome,updatedAt:cur.updatedAt});
        fillPick();
        if(!cur&&list.length)openRegua(list[0].id);
        else if(!cur)render();
      },()=>status('Sem conexão com o banco'));
    }else if(list.length){openRegua(list[0].id)}
    document.querySelectorAll('.edit-w').forEach(b=>b.style.display=canEdit?'':'none');
    render();
  }catch(e){if(list.length)openRegua(list[0].id)}
})();
})();
</script>
