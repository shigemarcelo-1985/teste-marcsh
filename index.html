<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard CLP - Cogna/Anhanguera</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a18;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e0dfd8;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:16px;font-weight:600}
.header span{font-size:12px;color:#888;background:#f0efe8;padding:4px 10px;border-radius:20px}
.container{max-width:1100px;margin:2rem auto;padding:0 1.5rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:2rem}
.kpi{background:#fff;border-radius:10px;padding:1.2rem;border:1px solid #e8e7e0}
.kpi-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:600;color:#1a1a18}
.kpi-sub{font-size:11px;color:#aaa;margin-top:4px}
.kpi.green .kpi-value{color:#1a7a50}
.kpi.amber .kpi-value{color:#b07010}
.kpi.red .kpi-value{color:#c03030}
.section{background:#fff;border-radius:10px;border:1px solid #e8e7e0;padding:1.5rem;margin-bottom:1.5rem}
.section h2{font-size:12px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1.2rem}
.channel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.channel{border-radius:8px;padding:1rem;border-top:3px solid}
.channel.email{border-color:#2a78d6;background:#f0f6ff}
.channel.whatsapp{border-color:#1a9e6a;background:#f0faf5}
.channel.sms{border-color:#d4900a;background:#fdf8ee}
.channel h3{font-size:12px;font-weight:600;margin-bottom:10px;color:#444}
.ch-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.ch-row:last-child{border:none}
.ch-row span{color:#777}
.ch-row strong{color:#222;font-weight:500}
.periodo{font-size:11px;color:#bbb;text-align:right;margin-top:1rem}
.loading{text-align:center;padding:4rem;color:#aaa;font-size:14px}
.error-msg{background:#fff0f0;border:1px solid #fcc;border-radius:8px;padding:1rem;color:#c03030;font-size:13px;margin-bottom:1.5rem;line-height:1.6}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:12px;background:#e8f0fe;color:#1a56b0;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="header">
  <h1>Dashboard CLP <span class="badge">Insider One</span></h1>
  <span id="ultima-atualizacao">Carregando...</span>
</div>
<div class="container">
  <div id="error-container"></div>
  <div id="content" class="loading">Carregando dados do Drive...</div>
</div>

<script>
// ==============================================
// CONFIGURACAO — substitua pelo ID real do arquivo JSON no Google Drive
// O ID fica na URL do arquivo: drive.google.com/file/d/SEU_ID_AQUI/view
// ==============================================
const DRIVE_FILE_ID = '19vXlVi5XIvS8pLqrPuwAsvwcIgaJjKuE';

const url = `https://drive.google.com/uc?export=download&id=${DRIVE_FILE_ID}`;

async function loadData() {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderDashboard(data);
  } catch(e) {
    document.getElementById('content').innerHTML = '';
    document.getElementById('error-container').innerHTML =
      `<div class="error-msg">
        <strong>Nao foi possivel carregar os dados.</strong><br>
        Verifique se o ID do arquivo Drive esta correto e se o compartilhamento esta como "qualquer pessoa com o link".<br>
        <small style="color:#999">${e.message}</small>
      </div>`;
  }
}

function fmt(v){ return v !== undefined && v !== null ? v : '--'; }

function renderDashboard(d) {
  document.getElementById('ultima-atualizacao').textContent = 'Atualizado: ' + fmt(d.periodo);
  const c = document.getElementById('content');
  c.className = '';
  c.innerHTML = `
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Leads</div><div class="kpi-value">${fmt(d.leads)}</div></div>
    <div class="kpi"><div class="kpi-label">Enviados</div><div class="kpi-value">${fmt(d.enviados)}</div></div>
    <div class="kpi green"><div class="kpi-label">Entregues</div><div class="kpi-value">${fmt(d.entregues)}</div><div class="kpi-sub">Taxa ${fmt(d.taxa_entrega)}</div></div>
    <div class="kpi amber"><div class="kpi-label">Cliques</div><div class="kpi-value">${fmt(d.cliques)}</div><div class="kpi-sub">CTR ${fmt(d.ctr)}</div></div>
    <div class="kpi red"><div class="kpi-label">Conversoes</div><div class="kpi-value">${fmt(d.conversoes)}</div></div>
    <div class="kpi red"><div class="kpi-label">Receita</div><div class="kpi-value">${fmt(d.receita)}</div><div class="kpi-sub">TM: ${fmt(d.ticket_medio)}</div></div>
  </div>

  <div class="section">
    <h2>Metricas por canal</h2>
    <div class="channel-grid">
      <div class="channel email">
        <h3>Email</h3>
        <div class="ch-row"><span>Enviados</span><strong>${fmt(d.email&&d.email.enviados)}</strong></div>
        <div class="ch-row"><span>Entregues</span><strong>${fmt(d.email&&d.email.entregues)}</strong></div>
        <div class="ch-row"><span>Aberturas</span><strong>${fmt(d.email&&d.email.aberturas)}</strong></div>
        <div class="ch-row"><span>Cliques</span><strong>${fmt(d.email&&d.email.cliques)}</strong></div>
        <div class="ch-row"><span>Conversoes</span><strong>${fmt(d.email&&d.email.conversoes)}</strong></div>
        <div class="ch-row"><span>Receita</span><strong>${fmt(d.email&&d.email.receita)}</strong></div>
      </div>
      <div class="channel whatsapp">
        <h3>WhatsApp</h3>
        <div class="ch-row"><span>Enviados</span><strong>${fmt(d.whatsapp&&d.whatsapp.enviados)}</strong></div>
        <div class="ch-row"><span>Entregues</span><strong>${fmt(d.whatsapp&&d.whatsapp.entregues)}</strong></div>
        <div class="ch-row"><span>Cliques</span><strong>${fmt(d.whatsapp&&d.whatsapp.cliques)}</strong></div>
        <div class="ch-row"><span>Conversoes</span><strong>${fmt(d.whatsapp&&d.whatsapp.conversoes)}</strong></div>
        <div class="ch-row"><span>Receita</span><strong>${fmt(d.whatsapp&&d.whatsapp.receita)}</strong></div>
      </div>
      <div class="channel sms">
        <h3>SMS</h3>
        <div class="ch-row"><span>Enviados</span><strong>${fmt(d.sms&&d.sms.enviados)}</strong></div>
        <div class="ch-row"><span>Entregues</span><strong>${fmt(d.sms&&d.sms.entregues)}</strong></div>
        <div class="ch-row"><span>Cliques</span><strong>${fmt(d.sms&&d.sms.cliques)}</strong></div>
        <div class="ch-row"><span>Conversoes</span><strong>${fmt(d.sms&&d.sms.conversoes)}</strong></div>
        <div class="ch-row"><span>Receita</span><strong>${fmt(d.sms&&d.sms.receita)}</strong></div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Entrega por canal</h2>
    <div style="position:relative;height:220px">
      <canvas id="chartEntrega" role="img" aria-label="Grafico de barras comparando enviados e entregues por canal"></canvas>
    </div>
  </div>

  <p class="periodo">Regua ${fmt(d.regua_id)} &middot; Periodo: ${fmt(d.periodo)}</p>
  `;

  new Chart(document.getElementById('chartEntrega'), {
    type: 'bar',
    data: {
      labels: ['Email', 'WhatsApp', 'SMS'],
      datasets: [
        {
          label: 'Enviados',
          data: [d.email&&d.email.enviados||0, d.whatsapp&&d.whatsapp.enviados||0, d.sms&&d.sms.enviados||0],
          backgroundColor: '#b0c8f0'
        },
        {
          label: 'Entregues',
          data: [d.email&&d.email.entregues||0, d.whatsapp&&d.whatsapp.entregues||0, d.sms&&d.sms.entregues||0],
          backgroundColor: '#2a78d6'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

loadData();
</script>
</body>
</html>
